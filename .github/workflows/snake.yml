name: generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=FF4D6D,FFFFFF&color_dots=F0F2F5,4F8EF7,2EC4B6,A78BFA,D4AF37
            dist/github-contribution-grid-snake-dark.svg?color_snake=FF4D6D,FFFFFF&color_dots=0D1117,4F8EF7,2EC4B6,A78BFA,D4AF37
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
