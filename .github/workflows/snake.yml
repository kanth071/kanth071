name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *" # runs once a day
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate a snake game from a GitHub contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=2EC4B6,4F8EF7,A78BFA,D4AF37&color_dots=ebedf0,BFD9F2,7FB3F0,4F8EF7,D4AF37
            dist/github-contribution-grid-snake-dark.svg?color_snake=2EC4B6,4F8EF7,A78BFA,D4AF37&color_dots=161B29,1B3A5C,2F5F91,4F8EF7,D4AF37

      - name: Push the generated files to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
